# PER-RELEASE APP STACK ("multi-service static" family variant) — booted per
# deploy under the project of one color:
#   COLOR=blue  IMAGE_TAG=sha-abc1234 docker compose -p gadg_blue  -f <this file> up -d --wait
#   COLOR=green IMAGE_TAG=sha-def5678 docker compose -p gadg_green -f <this file> up -d --wait
# The deploy script ALWAYS exports COLOR deliberately; the ${COLOR:-blue}
# default below only exists so a bare local `up` boots something (blue).
# There is deliberately NO top-level name: the -p flag names the project,
# and the two colors must never share one.
#
# NO platform stack in this variant: the four services are stateless (the
# guide is baked into the frontend image; the backends call public APIs and
# hold no data). The TLS edge is the infra repo's ONE shared `caddy`
# container, which reaches this stack's gadg_frontend_<color> container over
# the shared gadg_frontend network.
#
# app_internal is project-scoped ON PURPOSE: each color's nginx resolves the
# service names counter/facts/image (baked into its proxy_pass directives)
# only within its own color, so the frontend always reaches the SAME color's
# backends, never the other release's.
services:
  frontend:
    image: "ghcr.io/mayank-uk/github-actions-guide-frontend:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: gadg_frontend_${COLOR:-blue}
    restart: unless-stopped
    # No published ports — Caddy is the front door (TLS on :443) and reaches
    # this container BY NAME (gadg_frontend_<color>) on the shared
    # gadg_frontend network. Debug hatch (loopback, non-TLS):
    #   - "127.0.0.1:8080:80"
    depends_on:
      # nginx resolves the proxy_pass upstreams (counter/facts/image) at
      # startup and never re-resolves, so the backends must be up AND healthy
      # before the frontend starts — same color, same project.
      counter:
        condition: service_healthy
      facts:
        condition: service_healthy
      image:
        condition: service_healthy
    healthcheck:
      # nginx:1.27-alpine ships busybox wget; 127.0.0.1, not localhost
      # (busybox resolves localhost to ::1 first, nginx binds IPv4 only).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - app_internal
      - gadg_frontend

  counter:
    image: "ghcr.io/mayank-uk/github-actions-guide-counter:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: gadg_counter_${COLOR:-blue}
    restart: unless-stopped
    # No published ports — only the frontend's /api/count proxy calls it,
    # on this color's app_internal network.
    healthcheck:
      # node:20-alpine ships busybox wget; /health is the service's own
      # liveness endpoint (app/counter/server.js).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_internal

  facts:
    image: "ghcr.io/mayank-uk/github-actions-guide-facts:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: gadg_facts_${COLOR:-blue}
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim (Debian) ships NEITHER wget NOR curl — python itself
      # is the probe; /health is the service's own endpoint (app/facts/main.py).
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_internal

  image:
    image: "ghcr.io/mayank-uk/github-actions-guide-image:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: gadg_image_${COLOR:-blue}
    restart: unless-stopped
    healthcheck:
      # alpine:3.20 ships busybox wget; /healthz mirrors the service's
      # /health endpoint (app/image/main.go).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_internal

networks:
  # Plain project-scoped network: gadg_blue_app_internal /
  # gadg_green_app_internal. THIS is the isolation unit — the frontend's
  # baked `proxy_pass http://counter:3000` (etc.) resolves the service names
  # inside the color's own network.
  app_internal: {}
  # Shared with the infra repo's caddy (external, created by the deploy):
  # caddy reaches gadg_frontend_<color> here.
  gadg_frontend:
    name: gadg_frontend
    external: true
