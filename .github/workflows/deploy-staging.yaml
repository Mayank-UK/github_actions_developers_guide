# CD: deploy staging — the LOCAL LAB environment, runner-gated.
#
# Trigger: workflow_dispatch (Run workflow on `staging`), plus a
# workflow_run trigger on CI completing on `staging` that is currently
# DORMANT by construction: CI only runs on pushes to development and
# production (and PRs), so nothing today completes a CI run on a staging
# ref. It is declared anyway so the day CI grows a staging trigger, this
# deploy gates on it exactly like Deploy development does.
#
# Dispatch deploys deliberately: the lab's self-hosted runner (labels
# [self-hosted, deploy-local]) is usually offline, so a push-triggered
# deploy job would queue forever. The check-target job (cloud, cheap)
# queries GitHub's runners API first and prints a loud explanation when
# the runner is offline; the deploy job itself runs whenever check-target
# saw the runner ONLINE or the run is a manual dispatch (the human is
# expected to have started the runner).
#
# WHICH images get deployed: CI only builds+pushes on push to `development`
# (tags sha-<7> + development). This workflow resolves the tag by DESCENDING
# SECOND PARENTS from HEAD: a promotion merge's second parent is the branch
# merged in, so the walk unwinds staging<-development and stops at the first
# commit on `development` — the one CI built.
# => Prefer merging PRs with "Create a merge commit" (or fast-forward);
#    squash/rebase merges leave no second parent, so the walk stops at the
#    squash commit with a ::warning:: — which may reference images CI never
#    built (the deploy's pull step then fails loudly on the missing tag).
name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Deploy this tag instead of the merge commit (e.g. sha-abcd123 or abcd123)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check-target:
    name: check lab runner (mac-local)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reading the repo's registered self-hosted runners via the REST API
      # needs the actions scope — granted here, on this cheap cloud job
      # only, not on the deploy job that touches the lab itself.
      actions: read
    outputs:
      runner_online: ${{ steps.check.outputs.runner_online }}
    steps:
      - name: Check that the lab runner is online
        id: check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Empty on workflow_dispatch (no payload) — the gate below skips.
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail

          # workflow_run 'completed' fires on EVERY conclusion; only green
          # CI may deploy. Dispatch runs carry no payload — no gate.
          if [ "$GITHUB_EVENT_NAME" = "workflow_run" ] && [ "$WORKFLOW_RUN_CONCLUSION" != "success" ]; then
            echo "runner_online=false" >> "$GITHUB_OUTPUT"
            echo "CI completed with conclusion '$WORKFLOW_RUN_CONCLUSION' — nothing to deploy."
            exit 0
          fi

          # Is the self-hosted lab runner (mac-local) accepting jobs?
          # The runners API 403s the workflow's GITHUB_TOKEN in some
          # workflow_run contexts; a query failure is treated as OFFLINE —
          # this job NEVER goes red over a status lookup (a manual dispatch
          # still reaches a running lab whenever the runner really is up).
          status="$(curl -sS --max-time 30 \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runners" \
            | jq -r '.runners[] | select(.name == "mac-local") | .status' 2>/dev/null | head -n 1 || true)"

          if [ "$status" = "online" ]; then
            echo "runner_online=true" >> "$GITHUB_OUTPUT"
            echo "Lab runner 'mac-local' is ONLINE — the deploy job below will run on it."
            exit 0
          fi

          echo "runner_online=false" >> "$GITHUB_OUTPUT"
          cat <<'BOX'
          ================================================================
              DEPLOY SKIPPED — the lab runner (mac-local) is OFFLINE

          This environment deploys to the LOCAL docker-compose lab that
          runs on the developer's Mac, through the self-hosted runner
          'mac-local' (labels: self-hosted, deploy-local). That runner is
          OFFLINE right now, so there is no machine to deploy to — the
          deploy job below is skipped on purpose (on an offline runner it
          would queue forever).

          To deploy the staging lab:
            1. On the Mac:  task runner-start     (idempotent)
            2. Then:        Actions -> Deploy staging -> Run workflow
                            (branch: staging)

          This check job SUCCEEDS on purpose — a skip with a reason in the
          log beats a red X that means "nothing is actually wrong".
          ================================================================
          BOX

  deploy-staging:
    name: deploy (staging)
    needs: [check-target]
    # Automatic runs deploy only when check-target saw the runner ONLINE;
    # manual dispatch always attempts — the human is expected to have
    # started the runner (check-target's log explains the queue if not).
    if: needs.check-target.outputs.runner_online == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, deploy-local]
    environment: staging
    # Serialize staging deploys; never cancel a deploy already in flight.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Full history: the second-parent descent walks real parents and needs
      # origin/development to exist in the checkout.
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve image coordinates
        id: img
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Same lowercase-owner rule as CI (GHCR requires lowercase names);
          # tr lowercases, not a bash-4 expansion — macOS runner shell is 3.2.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            # Manual override (workflow_dispatch): accept sha-abc1234 or bare abc1234.
            case "$INPUT_TAG" in
              sha-*) tag="$INPUT_TAG" ;;
              *)     tag="sha-$INPUT_TAG" ;;
            esac
            echo "deploy tag from dispatch input: $tag"
          else
            # Second-parent descent: a promotion merge's SECOND parent is the
            # branch merged in, so walking second parents from HEAD unwinds
            # staging<-development and lands on the commit CI actually built.
            # Stops early at any commit already on origin/development (covers
            # fast-forward promotions AND development tips that are themselves
            # PR merge commits — built by CI, but a blind descent would
            # overshoot them). Fetch-depth 0 (above) makes origin/development
            # available.
            sha="$(git rev-parse HEAD)"
            while ! git merge-base --is-ancestor "$sha" origin/development 2>/dev/null; do
              # rev-list prints "sha parent1 parent2": field 3 is the second
              # parent; empty when the commit is a non-merge (or a root).
              second="$(git rev-list --parents -n1 "$sha" | awk '{ print $3 }')"
              if [ -z "$second" ]; then
                break
              fi
              sha="$second"
            done
            # Cut exactly 7 chars (--short=N may emit more on ambiguous
            # prefixes, and CI tags are always 7).
            tag="sha-$(printf '%s' "$sha" | cut -c1-7)"
            if ! git merge-base --is-ancestor "$sha" origin/development 2>/dev/null; then
              # e.g. squash/rebase merge or a direct push: the resolved commit
              # never went through development, so CI likely never built it.
              # Deploy anyway — the pull step fails loudly if images miss.
              echo "::warning::resolved commit $sha is NOT on development — CI only builds development pushes; images may not exist"
            fi
            echo "resolved deploy commit via second-parent descent: $sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy staging stack
        # Composite actions cannot read the `secrets` context — the token is
        # injected via env (stays masked in logs).
        uses: ./.github/actions/deploy-env
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          env: staging
          image_prefix: ${{ steps.img.outputs.prefix }}
          image_tag: ${{ steps.img.outputs.tag }}
