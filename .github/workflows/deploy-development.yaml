# CD: deploy development — started MANUALLY on `development`.
#
# Trigger: workflow_dispatch only (no inputs). This workflow USED to fire
# automatically via workflow_run when the workflow named "CI" completed on
# branch `development`. That automatic trigger was removed for an
# operational reason worth internalizing: the job below requires the
# self-hosted runner (labels [self-hosted, deploy-local]) — a Mac that is
# usually offline — so every push left the deploy QUEUED FOREVER waiting
# for a runner that was not there. The lab now deploys deliberately:
# runner up (`task runner-start`), then Run workflow.
#
# Dispatch deploys the moving `development` image tag (newest images CI
# built), because the dispatched branch HEAD may be a paths-filtered commit
# CI never built images for (the deploy's pull step would fail loudly on it
# within seconds, same gate as below).
#
# HISTORICAL, workflow_run era (the job below still carries its shape): the
# 'completed' event fired on EVERY conclusion — hence the success guard in
# the `if:` — and `github.sha` was the DEFAULT branch's commit, not the CI
# run's, so the built commit was read from
# `github.event.workflow_run.head_sha` (the checkout/tag expressions keep
# the head_sha-then-github.sha fallback; under dispatch, head_sha is empty
# and github.sha IS the dispatched ref's own commit). A manual CI dispatch
# with skip-build=true also completed 'success' without pushing images —
# the auto-trigger then failed at the deploy's pull step, visibly.
name: Deploy development

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: deploy (development)
    # workflow_run 'completed' fires on EVERY conclusion; deploy only on green
    # CI. Manual dispatch runs have no workflow_run payload — always deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # Runs on the self-hosted runner that lives next to the Docker host the
    # environments deploy to (label deploy-local — see GUIDE.md Part II).
    runs-on: [self-hosted, deploy-local]
    environment: development
    # Serialize development deploys; never cancel a rollout already in flight.
    concurrency:
      group: deploy-development
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The CI run's commit — NOT github.sha (default branch under
          # workflow_run). Under workflow_dispatch (no payload) fall back to
          # the dispatched ref's own commit.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Derive image coordinates
        id: img
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          # Same lowercase-owner rule as CI (GHCR requires lowercase
          # repository names); deploy exactly the sha tag CI just pushed.
          # POSIX-safe on purpose: macOS self-hosted runner shell is bash 3.2
          # (no bash-4 lowercase expansion); tr lowercases portably.
          # HEAD_SHA, not GITHUB_SHA: under workflow_run GITHUB_SHA is the
          # default branch's commit; head_sha is what CI built.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          # workflow_run: deploy the exact sha CI built. workflow_dispatch:
          # branch HEAD may be a paths-filtered commit CI never built (no
          # images) — deploy the moving `development` tag instead, which
          # always points at the newest built images.
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "tag=development" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy development stack
        # Composite actions cannot read the `secrets` context — the token is
        # injected via env (stays masked in logs).
        uses: ./.github/actions/deploy-env
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          env: development # compose stack (file .docker/docker-compose.development.yml, project github-actions-development); matches the GitHub environment above
          image_prefix: ${{ steps.img.outputs.prefix }}
          image_tag: ${{ steps.img.outputs.tag }}
