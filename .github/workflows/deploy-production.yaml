# CD: deploy production — started MANUALLY (Run workflow) on `production`.
#
# USED to fire automatically on push to `production`; that trigger was
# removed because the job requires the self-hosted runner (usually offline)
# — every push left the deploy queued forever. Dispatch on the branch you
# mean to promote; the tag walk below starts from the dispatched branch
# HEAD. The `production` GitHub environment still adds its approval gate.
#
# Tag resolution is identical to deploy-staging.yaml, one hop deeper: CI only
# builds+pushes on push to `development`, so the tag is resolved by DESCENDING
# SECOND PARENTS from HEAD — the walk unwinds production<-staging<-development
# and stops at the first commit on `development` (a plain HEAD^2 read would
# stop at the staging MERGE commit, which CI never built).
# => Prefer merging PRs with "Create a merge commit" (or fast-forward);
#    squash/rebase merges leave no second parent, so the walk stops at the
#    squash commit with a ::warning:: — which may reference images CI never
#    built (the rollout gate then fails loudly on ImagePullBackOff).
# The `production` GitHub environment (P4) adds a required-reviewer approval
# gate before this job's steps execute.
name: Deploy production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Deploy this tag instead of the merge commit (e.g. sha-abcd123 or abcd123)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  deploy-production:
    name: deploy (production)
    runs-on: [self-hosted, deploy-local]
    environment: production
    # Serialize production deploys; never cancel a rollout already in flight.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      # Full history: the second-parent descent walks real parents and needs
      # origin/development to exist in the checkout.
      - name: Check out repository (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve image coordinates
        id: img
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          # Same lowercase-owner rule as CI (GHCR requires lowercase names);
          # tr lowercases, not a bash-4 expansion — macOS runner shell is 3.2.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "prefix=ghcr.io/$owner" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            # Manual override (workflow_dispatch): accept sha-abc1234 or bare abc1234.
            case "$INPUT_TAG" in
              sha-*) tag="$INPUT_TAG" ;;
              *)     tag="sha-$INPUT_TAG" ;;
            esac
            echo "deploy tag from dispatch input: $tag"
          else
            # Second-parent descent: a promotion merge's SECOND parent is the
            # branch merged in, so walking second parents from HEAD unwinds
            # production<-staging<-development and lands on the commit CI
            # actually built. Stops early at any commit already on
            # origin/development (covers fast-forward promotions AND
            # development tips that are themselves PR merge commits — built by
            # CI, but a blind descent would overshoot them). Fetch-depth 0
            # (above) makes origin/development available.
            sha="$(git rev-parse HEAD)"
            while ! git merge-base --is-ancestor "$sha" origin/development 2>/dev/null; do
              # rev-list prints "sha parent1 parent2": field 3 is the second
              # parent; empty when the commit is a non-merge (or a root).
              second="$(git rev-list --parents -n1 "$sha" | awk '{ print $3 }')"
              if [ -z "$second" ]; then
                break
              fi
              sha="$second"
            done
            # Cut exactly 7 chars (--short=N may emit more on ambiguous
            # prefixes, and CI tags are always 7).
            tag="sha-$(printf '%s' "$sha" | cut -c1-7)"
            if ! git merge-base --is-ancestor "$sha" origin/development 2>/dev/null; then
              # e.g. squash/rebase merge or a direct push: the resolved commit
              # never went through development, so CI likely never built it.
              # Deploy anyway — the rollout gate fails loudly if images miss.
              echo "::warning::resolved commit $sha is NOT on development — CI only builds development pushes; images may not exist"
            fi
            echo "resolved deploy commit via second-parent descent: $sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Deploy production overlay
        # Composite actions cannot read the `secrets` context — the token is
        # injected via env (stays masked in logs).
        uses: ./.github/actions/deploy-env
        env:
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          env: production # kustomize overlay / namespace (github-actions-production); matches the GitHub environment above
          image_prefix: ${{ steps.img.outputs.prefix }}
          image_tag: ${{ steps.img.outputs.tag }}
