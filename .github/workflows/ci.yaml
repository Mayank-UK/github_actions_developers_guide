# CI pipeline for github-actions — the repo's ONE continuous-integration
# workflow, carrying both of its delivery tracks:
#   lab (teaching):  test-matrix x3 + render x3 + guide — every event;
#                    build-push x4 (github-actions-* images) — push to
#                    development only; consumed by the lab compose deploys.
#   site (public):   secrets + e2e (image smoke + Playwright) — every event;
#                    publish x4 (github-actions-guide-* images) +
#                    ghcr-prune — push to production only; consumed by
#                    deploy-production.yaml's SSH deploy to the VM.
# CI ends at build+push/publish, never deploys. Deploys live in one workflow
# per environment: deploy-{development,staging}.yaml (runner-gated lab
# deploys — they check the lab runner first and skip with a reason when it
# is offline) and deploy-production.yaml (the site deploy; see each file's
# header).
# Every `uses:` is pinned to a full 40-char commit SHA with the release tag in a
# trailing comment (supply-chain hygiene; updates via Dependabot/renovate).
name: CI

on:
  workflow_dispatch:
    inputs:
      skip-build:
        description: 'Run tests/render only, skip image build+push'
        required: false
        type: boolean
        default: false
  # Every push to either release branch and every PR, deliberately WITHOUT a
  # paths filter: the repo is small and almost any file feeds some job
  # (app/, .docker/, GUIDE.md, scripts/, e2e/, the workflows themselves).
  # PR checks exist for PRs INTO development (feature -> dev); release PRs
  # (-> production) are validated by the merge push itself, so every change
  # produces exactly one CI run.
  pull_request:
    branches: [development]
  push:
    branches: [development, production]

# Latest run per ref wins; obsolete pushes/PR updates are cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; build-push widens only packages: write.
permissions:
  contents: read

jobs:
  test-matrix:
    name: test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [facts, counter, image]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---------- facts: Python / FastAPI, pytest ----------
      - name: Set up Python
        if: matrix.service == 'facts'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/facts/requirements.txt
      - name: Install facts dependencies
        if: matrix.service == 'facts'
        # pytest (runner) and httpx (fastapi.testclient backend) are test-only
        # deps and deliberately not in the runtime requirements.txt.
        run: pip install -r app/facts/requirements.txt pytest httpx
      - name: Run facts tests
        if: matrix.service == 'facts'
        run: python -m pytest app/facts

      # ---------- counter: Node 22, built-in test runner ----------
      - name: Set up Node
        if: matrix.service == 'counter'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/counter/package-lock.json
      - name: Install counter dependencies
        if: matrix.service == 'counter'
        working-directory: app/counter
        run: npm ci
      - name: Run counter tests
        if: matrix.service == 'counter'
        # GLOB form is mandatory: a bare directory argument hangs Node 22.
        run: node --test "app/counter/*.test.js"

      # ---------- image: Go, go test ----------
      - name: Set up Go
        if: matrix.service == 'image'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: app/image/go.mod
          cache: false # no go.sum (zero module deps) — setup-go caching requires one
      - name: Run image tests
        if: matrix.service == 'image'
        working-directory: app/image
        run: go test ./...

  render:
    name: render (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [development, staging, production]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Render compose stack
        # docker compose config interpolates and merges the file into the
        # final stack definition — a cheap "is the deploy config valid"
        # check, on the preinstalled docker CLI of ubuntu-latest.
        run: |
          set -euo pipefail
          out="$(docker compose -f .docker/docker-compose.${{ matrix.env }}.yml config)"
          if [ -z "$out" ]; then
            echo "::error::docker-compose.${{ matrix.env }}.yml rendered to EMPTY output"
            exit 1
          fi
          echo "stack ${{ matrix.env }}: $(printf '%s\n' "$out" | wc -l | tr -d ' ') lines rendered"

  guide:
    name: guide snippets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check GUIDE.md snippets against sources
        # stdlib-only script — verifies every <!-- source: PATH --> fenced
        # block is an ordered subsequence of PATH, and that every other
        # block carries <!-- concept -->. Absent GUIDE.md passes (ratchet).
        run: python scripts/check_snippets.py

  build-push:
    name: build+push (${{ matrix.service }})
    needs: [test-matrix, render]
    # Pushes to development only — skipped (not failed) on pull requests and
    # on manual dispatch runs that set the skip-build input.
    if: github.event_name == 'push' && github.ref == 'refs/heads/development' && inputs.skip-build != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [facts, counter, image, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Derive image name and tags
        id: img
        shell: bash
        run: |
          set -euo pipefail
          # GHCR requires lowercase repository names. Lowercasing via tr, not
          # the bash-4-only lowercase expansion: self-hosted macOS runners run
          # /bin/bash 3.2 — keep every workflow shell POSIX-safe.
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$owner/github-actions-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # frontend builds from repo root (its Dockerfile COPYs GUIDE.md);
          # other services build from their app/ subdirectory.
          context: ${{ matrix.service == 'frontend' && '.' || format('app/{0}', matrix.service) }}
          file: .docker/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:sha-${{ steps.img.outputs.short }}
            ${{ steps.img.outputs.name }}:development
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────────────────
  # SITE track (public site served at
  # githubactionsdevelopersguide.mayankcodeworks.com). These jobs validate
  # and publish the images deploy-production.yaml ships to the VM. The
  # validation jobs run on every push and PR; the publish chain is gated to
  # pushes to production. The lab `test` job needs no site counterpart —
  # test-matrix above already runs the same suites.
  # ──────────────────────────────────────────────────────────────────────

  secrets-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The image smoke + browser gate: build ALL FOUR site production images
  # locally, boot them with the prod compose file plus the CI override
  # (frontend nginx published on the loopback), probe the homepage and a
  # live proxied API, then drive the real rendered guide with Playwright.
  # Skipped on dispatch runs that set skip-build (it builds all four images).
  e2e:
    name: Image smoke + browser gate
    needs: [test-matrix, secrets-scan]
    if: inputs.skip-build != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend image (local, amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # frontend builds from the repo root (its Dockerfile COPYs
          # GUIDE.md and app/frontend/*); the backends build from
          # their app/ subdirectories.
          context: .
          file: .docker/frontend/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/mayank-uk/github-actions-guide-frontend:ci
          cache-from: type=gha,scope=frontend
          # Fork PRs run with a read-only token — never attempt cache
          # writes there; the expression yields '' (cache write off).
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=frontend' || '' }}
          # Umami analytics (frontend only): build-time swap of the
          # beacon tokens in the served HTML. The values are PUBLIC
          # (visible in the served page source anyway) — repo Variables
          # first, secrets only as a fallback. Empty (not configured
          # yet) ships the pages without the beacon tag.
          build-args: |
              UMAMI_SRC=${{ vars.UMAMI_SRC || secrets.UMAMI_SRC || '' }}
              UMAMI_ID=${{ vars.UMAMI_ID || secrets.UMAMI_ID || '' }}

      - name: Build counter image (local, amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/counter
          file: .docker/counter/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/mayank-uk/github-actions-guide-counter:ci
          cache-from: type=gha,scope=counter
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=counter' || '' }}

      - name: Build facts image (local, amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/facts
          file: .docker/facts/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/mayank-uk/github-actions-guide-facts:ci
          cache-from: type=gha,scope=facts
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=facts' || '' }}

      - name: Build image image (local, amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app/image
          file: .docker/image/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/mayank-uk/github-actions-guide-image:ci
          cache-from: type=gha,scope=image
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=image' || '' }}

      - name: Prepare the external frontend network
        run: |
          set -euo pipefail
          # The prod compose references gadg_frontend as external:
          # compose looks it up, never creates it. Idempotent — safe
          # on reruns; a fresh runner just makes a fresh one.
          docker network create gadg_frontend 2>/dev/null || true

      - name: Boot the production images (prod compose + CI override)
        run: >
          docker compose -f .docker/docker-compose-prod.yml
          -f .docker/docker-compose.ci.yml up -d --wait --wait-timeout 300

      - name: Probe the homepage and a live proxied API
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 http://127.0.0.1:8080/ >/dev/null; then
              break
            fi
            echo "homepage probe attempt ${attempt} failed; retrying" >&2
            sleep 5
          done
          # /api/count proves the whole proxy chain: nginx → counter,
          # over the shared app_internal network. POST is the only
          # method /count answers; it needs no outbound internet
          # (unlike /api/facts and /api/image).
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 -X POST \
                -H 'Content-Type: application/json' \
                -d '{"text":"github actions guide"}' \
                http://127.0.0.1:8080/api/count; then
              exit 0
            fi
            echo "api probe attempt ${attempt} failed; retrying" >&2
            sleep 5
          done
          echo 'probe through nginx failed' >&2
          exit 1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Run browser E2E against the booted stack
        working-directory: e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-artifacts
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 14

      - name: Tear down the CI stack
        if: always()
        run: >
          docker compose -f .docker/docker-compose-prod.yml
          -f .docker/docker-compose.ci.yml down -v --remove-orphans

  # The deployment VM's CPU decides what gets published. The arch rides the
  # REPOSITORY variable VM_ARCH (Settings → Secrets and variables → Actions
  # → Variables — NOT the production environment, whose values are only
  # released to environment-bound jobs after approval). CI therefore holds
  # no VM credentials at all; flip the variable if the VM is ever replaced
  # with a different CPU. Fallback = the current VM's arm64.
  # (The old design SSHed into the VM to run uname -m; binding that job to
  # the protected environment made CI wait for a deployment approval.)

  # The site publish job (id "publish" — the lab's build-push above owns the
  # other image family). Attested single-platform images for the VM, double
  # tag: immutable sha-<7> + moving production.
  publish:
    name: publish (${{ matrix.service }})
    needs: [e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            image: ghcr.io/mayank-uk/github-actions-guide-frontend
            context: .
            dockerfile: .docker/frontend/Dockerfile
          - service: counter
            image: ghcr.io/mayank-uk/github-actions-guide-counter
            context: app/counter
            dockerfile: .docker/counter/Dockerfile
          - service: facts
            image: ghcr.io/mayank-uk/github-actions-guide-facts
            context: app/facts
            dockerfile: .docker/facts/Dockerfile
          - service: image
            image: ghcr.io/mayank-uk/github-actions-guide-image
            context: app/image
            dockerfile: .docker/image/Dockerfile

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute commit image tag
        id: image_tag
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          echo "tag=sha-${short_sha}" >> "$GITHUB_OUTPUT"

      # QEMU: every RUN step (npm ci / pip install / go build / apk) of
      # a cross-arch build needs the emulation layer — the VM is aarch64
      # while the runners are amd64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ vars.VM_ARCH || 'arm64' }}
          push: true
          # Supply-chain attestations: provenance (how/where the image
          # was built) + SBOM (what is inside it) — pushed alongside the
          # image as OCI artifacts, verifiable in GHCR.
          provenance: true
          sbom: true
          tags: |
            ${{ matrix.image }}:${{ steps.image_tag.outputs.tag }}
            ${{ matrix.image }}:production
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          # Umami analytics args exist only in the frontend image; for
          # the site's API backends the expressions yield '' and the
          # args go unconsumed (inert). Values are PUBLIC repo Variables
          # (they end up visible in the served HTML anyway); secrets
          # serve as a fallback. Empty = the pages ship without the
          # beacon tag.
          build-args: |
              UMAMI_SRC=${{ matrix.service == 'frontend' && (vars.UMAMI_SRC || secrets.UMAMI_SRC || '') || '' }}
              UMAMI_ID=${{ matrix.service == 'frontend' && (vars.UMAMI_ID || secrets.UMAMI_ID || '') || '' }}

  # GHCR tag retention: every production push leaves one sha-<7> version per
  # package. This job deletes sha-tagged versions beyond the newest 10 —
  # keep-10 aligns with the VM's keep-5 release dirs plus margin for
  # workflow_dispatch rollback targets; versions carrying
  # `production`/`latest` are never pruned. UNTAGGED versions are NEVER
  # deleted: GHCR lists every manifest as a version, so a tagged index has
  # untagged CHILDREN (per-arch images, provenance/SBOM attestations) and
  # deleting untagged versions breaks the tagged pull (2026-10-21 incident:
  # an untagged sweep killed the children of a freshly published image and
  # took the deploy down). Untagged accumulation is accepted and bounded;
  # delete failures only warn — hygiene must never block CD.
  ghcr-prune:
    name: Prune old GHCR image tags
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Delete sha-tagged GHCR versions beyond the newest 10
        shell: bash
        env:
          # The token rides in env, never inlined into the script
          # body; the script never runs with set -x.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          api='https://api.github.com'
          keep=10
          pages_max=3

          prune_package() {
            local pkg="$1"
            local encoded="${pkg//\//%2F}"
            local merged='[]'

            # (1) Paginate the version list; a short page ends the walk
            # (3 pages = 300 versions, far beyond anything real here).
            local page=1 page_file count
            while [ "$page" -le "$pages_max" ]; do
              page_file="$(mktemp)"
              if ! curl -fsS --max-time 30 \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                -o "$page_file" \
                "$api/user/packages/container/$encoded/versions?per_page=100&page=$page"; then
                echo "warn: could not list versions for $pkg — skipping it" >&2
                rm -f "$page_file"
                return 0
              fi
              if ! merged="$(jq --argjson m "$merged" --slurpfile p "$page_file" -n '$m + ($p[0] // [])')"; then
                echo "warn: malformed version page for $pkg — skipping it" >&2
                rm -f "$page_file"
                return 0
              fi
              count="$(jq 'length' "$page_file")"
              rm -f "$page_file"
              if [ "$count" -lt 100 ]; then
                break
              fi
              page=$((page + 1))
            done

            # Sanity guard: a malformed response must never feed the
            # delete loop — assert the accumulated list parses as a
            # JSON array BEFORE filtering; if not, warn and skip the
            # package (exit 0) rather than deleting blindly.
            if ! printf '%s' "$merged" | jq -e 'type == "array"' >/dev/null 2>&1; then
              echo "warn: version list for $pkg did not parse as JSON — skipping it" >&2
              return 0
            fi

            # (2) sha-tagged versions, newest first; (3) candidates
            # are those beyond the newest $keep minus any version
            # still carrying a protected tag. UNTAGGED versions are
            # deliberately absent from this rule: the versions API
            # exposes no parent/referrer link, so garbage orphans
            # and the live children of KEPT indexes are
            # indistinguishable — the 2026-10-21 incident deleted
            # freshly pushed children and broke every pull.
            local candidates
            candidates="$(printf '%s' "$merged" | jq --argjson keep "$keep" '
              [ .[]
                | select((.metadata.container.tags // [])
                     | any(.[]; test("^sha-[0-9a-f]{7}$"))) ]
              | sort_by(.created_at) | reverse
              | .[$keep:]
              | map(select(
                    ((.metadata.container.tags // []) | index("production") | not) and
                    ((.metadata.container.tags // []) | index("latest") | not)))
            ')"

            # (4) Deletes are individually NON-FATAL: a failure warns
            # and the loop continues — hygiene must never block CD.
            local total
            total="$(printf '%s' "$candidates" | jq 'length')"
            if [ "$total" -eq 0 ]; then
              echo "$pkg: nothing to prune"
              return 0
            fi
            echo "$pkg: pruning $total sha-tagged version(s) beyond the newest $keep"
            local id tags
            while read -r id tags; do
              curl -fsS --max-time 30 -X DELETE \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H 'Accept: application/vnd.github+json' \
                "$api/user/packages/container/$encoded/versions/$id" \
                || echo "warn: failed to delete $pkg version $id — continuing" >&2
              echo "pruned $pkg version $id (tags: $tags)"
            done < <(printf '%s' "$candidates" | jq -r '.[] | "\(.id) \((.metadata.container.tags // []) | join(","))"')
          }

          # The /user/* package endpoints address GHCR containers by
          # their BARE name (ghcr.io/mayank-uk/github-actions-guide-frontend
          # is package "github-actions-guide-frontend"; the namespaced
          # form 404s). The encode above is a no-op here, kept
          # defensive for any future name carrying a '/'.
          prune_package 'github-actions-guide-frontend'
          prune_package 'github-actions-guide-counter'
          prune_package 'github-actions-guide-facts'
          prune_package 'github-actions-guide-image'
